{% extends 'layouts/base.html' %}
{% block title %}Change Password{% endblock %}
{% block topbar_title %}Change Password{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">Change Password</div>
    <div class="page-subtitle">Update your account password</div>
  </div>
</div>

<div style="max-width: 460px;">
  <div class="card">
    <div class="card-header">
      <i class="bi bi-key text-accent"></i>
      <span class="card-header-title">Update Password</span>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('auth.change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">Current Password <span class="required">*</span></label>
          <input type="password" name="current_password" class="form-control" required>
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label class="form-label">New Password <span class="required">*</span></label>
          <input type="password" name="new_password" class="form-control" required minlength="6">
          <div class="form-text">Minimum 6 characters</div>
        </div>
        <div class="form-group" style="margin-bottom:20px;">
          <label class="form-label">Confirm New Password <span class="required">*</span></label>
          <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Update Password</button>
          <a href="{{ url_for('dashboard.index') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
