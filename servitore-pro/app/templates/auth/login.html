<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Servitore Pro | Sai Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">S</div>
      <div class="login-title">Servitore Pro</div>
      <div class="login-subtitle">Sai Services — Service Management System</div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}" style="margin-bottom:16px;">
            <i class="bi bi-exclamation-circle"></i> {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label" for="username"><i class="bi bi-person me-1"></i>Username or Email</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom:20px;">
        <label class="form-label" for="password"><i class="bi bi-lock me-1"></i>Password</label>
        <div style="position:relative;">
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password" style="padding-right:40px;">
          <button type="button" id="toggle-pw" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:15px;">
            <i class="bi bi-eye" id="pw-icon"></i>
          </button>
        </div>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
        <label class="form-check" style="display:flex;align-items:center;gap:6px;cursor:pointer;">
          <input type="checkbox" name="remember_me" class="form-check-input" id="remember_me">
          <span style="font-size:12.5px;color:var(--text-secondary);">Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary w-100" style="justify-content:center; padding:10px;">
        <i class="bi bi-box-arrow-in-right"></i> Sign In
      </button>
    </form>

    <div style="text-align:center; margin-top:20px; font-size:12px; color:var(--text-muted);">
      Default credentials: <strong style="color:var(--accent);">admin</strong> / <strong style="color:var(--accent);">admin123</strong>
    </div>
  </div>
</div>

<script>
document.getElementById('toggle-pw').addEventListener('click', function() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    if (pw.type === 'password') { pw.type = 'text'; icon.className = 'bi bi-eye-slash'; }
    else { pw.type = 'password'; icon.className = 'bi bi-eye'; }
});
</script>
</body>
</html>
