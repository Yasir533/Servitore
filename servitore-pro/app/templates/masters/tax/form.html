{%  extends 'layouts/base.html' %}
{% block title %}{{ 'Edit' if item else 'Add' }} Tax Master{% endblock %}
{% block topbar_title %}{{ 'Edit' if item else 'Add' }} Tax Master{% endblock %}
{% block content %}
<div class="page-header"><div><div class="page-title">{{ 'Edit' if item else 'Add' }} Tax Master</div></div><a href="{{ url_for('masters.taxes') }}" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a></div>
<div class="card" style="max-width:600px;">
  <div class="card-header"><i class="bi-percent text-accent"></i><span class="card-header-title">Tax Master Details</span></div>
  <div class="card-body">
    <form method="POST" action="{{ url_for('masters.edit_tax', id=item.id) if item else url_for('masters.add_tax') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Name <span class="required">*</span></label><input type="text" name="name" class="form-control" value="{{ item.name if item else '' }}" required></div>
        <div class="form-group"><label class="form-label">Percentage (%) <span class="required">*</span></label><input type="number" name="percentage" class="form-control" step="0.01" value="{{ item.percentage if item else '' }}" required></div>
        <div class="form-group"><label class="form-label">Description </label><input type="text" name="description" class="form-control" value="{{ item.description if item else '' }}" ></div>
        
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;"><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> {{ 'Update' if item else 'Add' }}</button><a href="{{ url_for('masters.taxes') }}" class="btn btn-secondary">Cancel</a></div>
    </form>
  </div>
</div>
{% endblock %}
