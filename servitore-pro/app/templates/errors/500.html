{% extends 'layouts/base.html' %}
{% block title %}500 — Server Error{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:60vh;">
  <div style="text-align:center;">
    <div style="font-family:'Outfit',sans-serif;font-size:80px;font-weight:800;color:#f59e0b;line-height:1;opacity:0.4;">500</div>
    <h2 style="font-size:20px;font-weight:600;color:var(--text-primary);margin:12px 0 8px;">Internal Server Error</h2>
    <p style="color:var(--text-muted);margin-bottom:24px;">Something went wrong. Please try again or contact your administrator.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="bi bi-house"></i> Go to Dashboard</a>
  </div>
</div>
{% endblock %}
